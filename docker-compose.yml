version: '3.8'

services:
  apex-quant-daemon:
    build: .
    container_name: apex_quant_live_daemon
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
